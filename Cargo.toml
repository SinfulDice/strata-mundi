[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/SinfulDice/strata-mundi"

[workspace.dependencies]
strata-core = { path = "crates/core" }
strata-worldgen = { path = "crates/worldgen" }
strata-server = { path = "crates/server" }
strata-protocol = { path = "crates/protocol" }
strata-client = { path = "crates/client" }

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
crossbeam-channel = "0.5"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
gilrs = "0.11"
glam = "0.34"
png = "0.18"
pollster = "1"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = "0.12"
unic-langid = "0.9"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
