[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/SinfulDice/strata-mundi"

[workspace.dependencies]
strata-core = { path = "crates/core" }
strata-worldgen = { path = "crates/worldgen" }
strata-server = { path = "crates/server" }
strata-protocol = { path = "crates/protocol" }
strata-client = { path = "crates/client" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = "0.12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
