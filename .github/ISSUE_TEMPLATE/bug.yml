name: Bug
description: Quelque chose ne marche pas comme prévu / Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe / What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer / What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire / Steps to reproduce
      placeholder: "1. Créer un monde avec la seed 42\n2. ..."
  - type: input
    id: version
    attributes:
      label: Version du jeu / Game version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Système et carte graphique / OS and GPU
      placeholder: "Linux Mint 22, AMD RX 6600"
